services:

  postgres:
    image: postgres:16
    container_name: insightsrank-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: insightsrank
      POSTGRES_USER: insightsrank_user
      POSTGRES_PASSWORD: insightsrank_dev_password

    ports:
      - "5432:5432"

    volumes:
      - insightsrank_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightsrank_user -d insightsrank"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: insightsrank-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - insightsrank_redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:

  insightsrank_postgres_data:
    name: insightsrank_postgres_data

  insightsrank_redis_data:
    name: insightsrank_redis_data
